<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover final frame test</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#cover{position:fixed;inset:0;background:#261e18;overflow:hidden}
#cover-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(1.06) brightness(.97)}
#cover-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(115% 85% at 50% 44%, rgba(38,30,24,0) 42%, rgba(38,30,24,.42) 74%, rgba(26,20,15,.82) 100%)}
.cover-inner{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  pointer-events:none;opacity:0;width:100%;max-width:80%;padding:24px;box-sizing:border-box}
.cover-inner>*{text-align:center;min-width:0}
.cover-kicker{font-family:'Marcellus',sans-serif;font-size:clamp(.65rem,2.2vw,.85rem);
  letter-spacing:.14em;text-transform:uppercase;color:#8a6f45;width:100%}
.cover-names{font-family:'Great Vibes',serif;font-weight:400;
  font-size:clamp(2.3rem,10vw,3.9rem);line-height:1.06;color:#3b2c1d;
  text-shadow:0 1px 1px rgba(255,255,255,.55)}
.cover-amp{font-family:'Great Vibes',serif;color:#7c2d2d;font-size:clamp(1.3rem,5vw,2rem);line-height:1;margin:-4px 0}
.cover-rule{width:min(160px,44vw);height:1px;background:linear-gradient(90deg,transparent,#b9945a,transparent);margin:4px auto}
.cover-date{font-family:'Marcellus',sans-serif;font-size:clamp(.72rem,2.4vw,.95rem);font-weight:400;letter-spacing:.06em;color:#6d5636;white-space:normal;max-width:100%}
</style>
</head>
<body>
<div id="cover">
  <video id="cover-video" muted playsinline preload="auto" src="openinv.mp4"></video>
  <div id="cover-scrim"></div>
  <div class="cover-inner" id="inner">
    <div class="cover-kicker">Together with their families</div>
    <h1 class="cover-names">Ariana</h1>
    <div class="cover-amp">&amp;</div>
    <h1 class="cover-names">Diyar</h1>
    <div class="cover-rule"></div>
    <div class="cover-date">Saturday · 12 December 2026 · 6:00 PM</div>
  </div>
</div>
<script>
const v = document.getElementById("cover-video");
const inner = document.getElementById("inner");
v.loop = false;
v.onended = () => { v.pause(); inner.style.opacity = 1; };
v.play().catch(()=>{});
</script>
</body>
</html>
